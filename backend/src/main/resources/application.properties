spring.application.name=backend
#Database connection
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/shopaccgame
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

spring.session.jdbc.initialize-schema=never

#Redis Host configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password= #PASSWORD REDIS HOST

#Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username= #Email username
spring.mail.password=rbfe bnvp khcp lxor
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.default-encoding=UTF-8

#OAuth2 Google configuration
spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=https://localhost:8443/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=Google

logging.level.com.shopaccgame=DEBUG

#SSL/HTTPS configuration
server.port=8443
server.ssl.key-store=classpath:
server.ssl.key-store-password=
server.ssl.key-alias=
server.ssl.key-store-type=JKS
server.ssl.enabled=true

security.csrf.excluded-paths=/api/users/refresh-token,/api/users/logout,/api/users/login,/api/users/register

jwt.secret= #JWT Key
jwt.expiration=800000
refresh-token.expiration = 259200000
#Login Attempts configuration
login.Failed.Count.Attempt=10
lock.Time=15

#Recovery configuration
recovery.token.expire.time=60

frontend.success.redirect=http://localhost:3000/