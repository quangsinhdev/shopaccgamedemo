<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập nhật mật khẩu | Shopaccgame.com</title>
    <link rel="stylesheet" href="/css/login.css">
    <script src="https://kit.fontawesome.com/67afa8d00d.js" crossorigin="anonymous"></script>
</head>

<body>
    <form method="post" class="login-form" id="updatenewpassword-form">
        <h1 class="recovery-title">KHÔI PHỤC MẬT KHẨU</h1>
        <div class="input-box">
            <input type="hidden" name="tokenrecovery" id="tokenrecovery" placeholder="Nhập token vào đây..." value="" disabled>
        </div>
        <p class="field">Mật khẩu mới</p>
        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" name="newPassword" id="newPassword" placeholder="Nhập mật khẩu mới...">
        </div>
        <p class="field">Xác nhận lại mật khẩu mới</p>
        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" name="confirmNewPassword" id="confirmNewPassword" placeholder="Nhập lại mật khẩu...">
        </div>
        <button id="submit-button" class="recovery-btn">Cập nhật mật khẩu</button>
        <p class="register"><i class="fa-regular fa-comment-dots"></i> Token không hợp lệ, hết hạn? <a href="/recovery"><b>Khôi phục lại</b></a></p>
    </form>
    <div id="notification" class="notification" style="display:none;">
        <p id="notification-text"></p>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/authentications/update-password.js"></script>
</body>

</html>
