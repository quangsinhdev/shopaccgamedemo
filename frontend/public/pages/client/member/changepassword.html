<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu | Shopaccgame.com</title>
    <link rel="stylesheet" href="/css/changepassword.css">
    <script src="https://kit.fontawesome.com/67afa8d00d.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div class="logo">
            <a href="/" class="logo-link">
                <img src="/assets/images/logoshop.png" alt="Logo" class="logo-image">
            </a>
        </div>
        <div class="dropdown">
            <button class="dropbtn">
                <i class="fas fa-bars"></i>Menu
            </button>
            <div class="dropdown-content">
                <a href="/">Trang chủ</a>
                <a href="/pages/client/member/profile.html">Trang cá nhân</a>
                <a href="#" id="logout-btn">Đăng xuất</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="password-change-card">
            <div class="profile-info">
                <div class="avatar">
                    <img src="/assets/images/memberlogo-2.webp" alt="Avatar">
                </div>
                <div class="details">
                    <h3><span id="fullname-display"></span></h3>
                    <p><i class="fa-solid fa-envelope"></i>Email: <span id="email-display"></span></p>
                    <p><i class="fa-solid fa-chart-simple"></i>Trạng thái: <span id="status-display"></span></p>
                </div>
            </div>

            <h2 class="title-changepassword">Thay đổi mật khẩu<i class="fa-brands fa-github-alt"></i></h2>
            <form method="post" id="change-password-form">
                <div class="input-group">
                    <label for="currentPassword">Mật khẩu hiện tại</label>
                    <input type="password" id="currentPassword" name="currentPassword" placeholder="Nhập mật khẩu hiện tại..." required>
                </div>
                <div class="input-group">
                    <label for="newPassword">Mật khẩu mới</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Nhập mật khẩu mới..." required>
                </div>
                <div class="input-group">
                    <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu mới..." required>
                </div>
                <div class="btn-container">
                    <button type="submit" class="btn-submit">Cập nhật mật khẩu</button>
                </div>
            </form>
        </div>
    </div>

    <div id="notification" class="notification">
        <span class="icon" id="notification-icon"><i class="fas fa-exclamation-circle"></i></span>
        <span id="notification-text"></span>
    </div>

    <footer>
        <p>© 2025 Shopaccgame.com | <a href="/terms">Điều khoản sử dụng</a> | <a href="/privacy">Chính sách bảo mật</a></p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/users/change-password.js"></script>
</body>
</html>
